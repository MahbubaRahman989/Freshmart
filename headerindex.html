
   <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #f9f9f9;
            --dark: #333;
            --gray: #95a5a6;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            background-color: #f5f5f5;
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Header Styles */
        header {
            background-color: white;
            box-shadow: var(--shadow);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--primary);
            font-size: 24px;
        }

        .logo h1 {
            font-size: 24px;
            color: var(--primary);
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.2);
        }

        .search-bar i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .user-actions {
            display: flex;
            gap: 20px;
        }
		
		
		.auth-btn {
			text-decoration: none;
			font-size: 15px;
			font-weight: 600;
			color: #333;
			padding: 6px 14px;
			border-radius: 6px;
			border: 1px solid #aaa;
			transition: 0.3s;
			margin-right: 8px;
		}

		.auth-btn:hover {
			background: #28a745;
			color: white;
			border-color: #28a745;
		}

		.auth-btn.register {
			background: #28a745;
			color: white;
			border-color: #28a745;
		}

		.auth-btn.register:hover {
			background: #218838;
		}




        .user-actions i {
            font-size: 20px;
            color: var(--dark);
            cursor: pointer;
            transition: var(--transition);
        }

        .user-actions i:hover {
            color: var(--primary);
        }
		
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-shopping-basket"></i>
                <h1>FreshMart</h1>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for products...">
                <i class="fas fa-search"></i>
            </div>
            <div class="user-actions">
			<!-- Login & Register Buttons -->
			<a href="login.html" class="auth-btn">Login</a>
            <a href="registration.html" class="auth-btn register">Register</a>
                <i class="fas fa-user"></i>
                <div class="cart-icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>
