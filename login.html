<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #a1d782, #1899a6);
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            animation: bounce 2s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .logo h1 {
            color: #5ca467;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .logo p {
            color: #3cc45d;
            font-size: 18px;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 35px 10px 0;
            font-size: 16px;
            color: #333;
            border: none;
            border-bottom: 2px solid #ddd;
            outline: none;
            background: transparent;
            transition: all 0.3s ease;
        }

        .input-group label {
            position: absolute;
            top: 10px;
            left: 0;
            font-size: 16px;
            color: #777;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -20px;
            font-size: 12px;
            color: #6a994e;
        }

        .input-group input:focus {
            border-bottom-color: #6a994e;
        }

        .toggle-password {
            position: absolute;
            right: 0;
            top: 10px;
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            z-index: 10;
        }

        .toggle-password:hover {
            color: #6a994e;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
        }

        .remember input {
            margin-right: 5px;
        }

        .forgot-password {
            color: #6a994e;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #386641;
            text-decoration: underline;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e33f3f, #5115d7);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .signup-link a {
            color: #6a994e;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: #386641;
            text-decoration: underline;
        }

        .floating-items {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .floating-item {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.7);
            animation: float 10s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        .floating-item:nth-child(1) { top: 10%; left: 10%; animation-duration: 15s; }
        .floating-item:nth-child(2) { top: 20%; right: 10%; animation-duration: 12s; }
        .floating-item:nth-child(3) { bottom: 20%; left: 15%; animation-duration: 18s; }
        .floating-item:nth-child(4) { bottom: 10%; right: 15%; animation-duration: 14s; }
        .floating-item:nth-child(5) { top: 50%; left: 5%; animation-duration: 16s; }
        .floating-item:nth-child(6) { top: 40%; right: 5%; animation-duration: 13s; }

        .error-msg{
            background:#ffe1e1;
            color:#b00020;
            padding:10px 12px;
            border-radius:10px;
            margin-bottom:15px;
            font-size:14px;
            border:1px solid #ffb3b3;
        }

        @media (max-width: 480px) {
            .login-box { padding: 30px 20px; }
            .logo h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="floating-items">
        <div class="floating-item">🍎</div>
        <div class="floating-item">🥦</div>
        <div class="floating-item">🍞</div>
        <div class="floating-item">🥛</div>
        <div class="floating-item">🍌</div>
        <div class="floating-item">🥚</div>
    </div>

    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>FreshMart</h1>
                <p>Your Local Grocery Store</p>
            </div>

            <!-- Error box (same design, dynamic text) -->
            <div id="errorBox" class="error-msg" style="display:none;"></div>

            <form action="login.php" method="POST" id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" name="username" required>
                    <label for="username"><i class="fas fa-user"></i> Username or Email</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" name="password" required>
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="options">
                    <div class="remember">
                        <input type="checkbox" id="remember" name="remember" value="1">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <div class="signup-link">
                    Don't have an account? <a href="registration.html">Sign up</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;

            const icon = this.querySelector('i');
            icon.className = (type === 'text') ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // Show error message based on URL query
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const errorBox = document.getElementById('errorBox');

        if (error === 'invalid') {
            errorBox.innerText = "Invalid username/email or password!";
            errorBox.style.display = 'block';
        } else if (error === 'disabled') {
            errorBox.innerText = "Your account has been disabled by admin. Please contact support.";
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
